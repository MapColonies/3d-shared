openapi: 3.0.3
info:
  title: 3D catalog record
  version: 2.0.0
paths: {}
components:
  schemas:
    productType:
      type: string
      enum:
        - 3DPhotoRealistic
        - 3DPhotoRealisticBest
        - 3DSemantic
        - 3DSemanticMesh
        - QuantizedMeshDTMBest
        - QuantizedMeshDSMBest
        - 3DPointCloud
      description: Type of 3D product
    recordStatus:
      type: string
      enum:
        - PUBLISHED
        - UNPUBLISHED
        - BEING_DELETED
      description: The status of the record
    link:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        protocol:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
      required:
        - protocol
        - url
      additionalProperties: false
    catalogRecordMetadata:
      type: object
      properties:
        productName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of product
        productType:
          type: string
          enum:
            - 3DPhotoRealistic
            - 3DPhotoRealisticBest
            - 3DSemantic
            - 3DSemanticMesh
            - QuantizedMeshDTMBest
            - QuantizedMeshDSMBest
            - 3DPointCloud
          description: Type of 3D product
        productSubType:
          type: string
          nullable: true
          description: Sub-type of the product within the product type
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Description and comments
        imagingTimeBeginUTC:
          type: string
          format: date-time
          description: Oldest imaging date of the parts
        imagingTimeEndUTC:
          type: string
          format: date-time
          description: Newest imaging date of the parts
        minResolutionMeter:
          type: number
          minimum: 0.01
          maximum: 8000
          description: Minimum resolution in meters
        maxResolutionMeter:
          type: number
          minimum: 0.01
          maximum: 8000
          description: Maximum resolution in meters
        maxAbsoluteAccuracyCEP90:
          type: number
          minimum: 0
          maximum: 999
          description: Maximum absolute CEP90 horizontal accuracy
        maxAbsoluteAccuracyLEP90:
          type: number
          minimum: 0
          maximum: 999
          description: Maximum absolute LEP90 vertical accuracy
        maxAbsoluteAccuracySEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 250
          description: Maximum absolute SEP90 spherical accuracy
        maxRelativeAccuracyCEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          description: Maximum relative CEP90 horizontal accuracy
        maxRelativeAccuracyLEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          description: Maximum relative LEP90 vertical accuracy
        maxRelativeAccuracySEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Maximum relative SEP90 spherical accuracy
        sensors:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: Sensors used for the product
        footprint:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - Polygon
                coordinates:
                  type: array
                  items:
                    type: array
                    items:
                      anyOf:
                        - type: array
                          items:
                            type: number
                          minItems: 2
                          maxItems: 2
                        - type: array
                          items:
                            type: number
                          minItems: 3
                          maxItems: 3
                    minItems: 4
              required:
                - type
                - coordinates
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - MultiPolygon
                coordinates:
                  type: array
                  items:
                    type: array
                    items:
                      type: array
                      items:
                        anyOf:
                          - type: array
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                          - type: array
                            items:
                              type: number
                            minItems: 3
                            maxItems: 3
                      minItems: 4
              required:
                - type
                - coordinates
          description: Geographic demarcation of the product
        srsId:
          type: string
          minLength: 1
          description: EPSG code of the reference system
        srsName:
          type: string
          minLength: 1
          description: Name of the reference system
        region:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: Regions included in the product
        classification:
          type: string
          pattern: ^[a-zA-Z0-9]+$
          description: Classification of the product
        productionSystem:
          type: string
          minLength: 1
          description: Production system
        productionSystemVersion:
          type: string
          minLength: 1
          maxLength: 20
          description: Version of the production system
        productionDate:
          type: string
          format: date-time
          description: Production date of the product
        producerName:
          type: string
          minLength: 1
          description: Name of the producer (product owner)
        keywords:
          type: string
          nullable: true
          description: Keywords of the product
      required:
        - productName
        - productType
        - imagingTimeBeginUTC
        - imagingTimeEndUTC
        - minResolutionMeter
        - maxResolutionMeter
        - maxAbsoluteAccuracyCEP90
        - maxAbsoluteAccuracyLEP90
        - sensors
        - footprint
        - srsId
        - srsName
        - region
        - classification
        - productionSystem
        - productionSystemVersion
        - productionDate
        - producerName
      additionalProperties: false
    catalogRecord:
      type: object
      properties:
        productName:
          type: string
          minLength: 1
          maxLength: 120
          description: Name of product
        productType:
          type: string
          enum:
            - 3DPhotoRealistic
            - 3DPhotoRealisticBest
            - 3DSemantic
            - 3DSemanticMesh
            - QuantizedMeshDTMBest
            - QuantizedMeshDSMBest

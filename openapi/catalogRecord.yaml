                - coordinates
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - MultiPolygon
                coordinates:
                  type: array
                  items:
                    type: array
                    items:
                      type: array
                      items:
                        anyOf:
                          - type: array
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                          - type: array
                            items:
                              type: number
                            minItems: 3
                            maxItems: 3
                      minItems: 4
              required:
                - type
                - coordinates
          description: Geographic demarcation of the product
        minResolutionMeter:
          type: number
          minimum: 0.01
          maximum: 8000
          description: Minimum resolution in meters
        maxResolutionMeter:
          type: number
          minimum: 0.01
          maximum: 8000
          description: Maximum resolution in meters
        maxAbsoluteAccuracyCEP90:
          type: number
          minimum: 0
          maximum: 999
          description: Maximum absolute CEP90 horizontal accuracy
        maxAbsoluteAccuracyLEP90:
          type: number
          minimum: 0
          maximum: 999
          description: Maximum absolute LEP90 vertical accuracy
        maxAbsoluteAccuracySEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 250
          description: Maximum absolute SEP90 spherical accuracy
        maxRelativeAccuracyCEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          description: Maximum relative CEP90 horizontal accuracy
        maxRelativeAccuracyLEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 999
          description: Maximum relative LEP90 vertical accuracy
        maxRelativeAccuracySEP90:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Maximum relative SEP90 spherical accuracy
        sensors:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          description: Sensors used for the product
        classification:
          type: string
          pattern: ^[a-zA-Z0-9]+$
          description: Classification of the product
        producerName:
          type: string
          minLength: 1
          description: Name of the producer (product owner)
        keywords:
          type: string
          nullable: true
          description: Keywords of the product
      additionalProperties: false
    catalogRecordStatusUpdate:
      type: object
      properties:
        productStatus:
          type: string
          enum:
            - PUBLISHED
            - UNPUBLISHED
            - BEING_DELETED
          description: The status of the record
      required:
        - productStatus
      additionalProperties: false
  parameters: {}

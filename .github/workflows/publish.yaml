name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Init nodejs
        uses: ./.github/actions/init-npm
      - run: npm install -g npm
      - name: Publish to npm
        run: npm publish --access public
